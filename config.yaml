temperature_profiles:
  profiles:
    gpt-5:
      fixed: 1.0
      ignore_creativity: true
    gpt-5-mini:
      fixed: 1.0
      ignore_creativity: true
    gpt-5-nano:
      fixed: 1.0
      ignore_creativity: true
    gemini-3-flash-preview:
      fixed: 1.0
      ignore_creativity: true
    gpt-5.2:
      creativity_map:
        - - 0.0
          - 0.0
        - - 0.5
          - 0.35
        - - 1.0
          - 0.7
    gemini-3-pro-preview:
      fixed: 1.0
      ignore_creativity: true
    default:
      creativity_map:
        - - 0.0
          - 0.0
        - - 1.0
          - 1.0

system_llm_profiles:
  # For quality - more expensive/slower
  default:
    model: "gemini-3-flash-preview"
    temperature: 1.0
    max_tokens: 16384

  # For speed/cost - lighter tasks
  quick:
    model: "gpt-5-nano" # Or claude-3-5-haiku, gemini-3-flash
    temperature: 1.0
    max_tokens: 4096
